name: "Portal — Deploy PMGO"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-s3-cloudfront.yml
    with:
      client_name: "pmgo"
      environment: "production"
      s3_bucket: "portal-pmgo-prod-385697366782"
      cloudfront_distribution_id: "EB9OFUJ0BYGXJ"
      aws_region: "sa-east-1"
      react_app_api_url: "https://api.go.inttegrasocial.com.br/api"
      react_app_front_app: "pmgo"
      react_app_title: "PMGO"
      react_app_description: "Dashboard da Polícia Militar do Estado de Goiás - PMGO"
      react_app_sga_api_base_url: "https://sandbox.sga.integrapay.com.br/api"
    secrets: inherit
