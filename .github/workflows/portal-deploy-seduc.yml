name: "Portal — Deploy SEDUC"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-s3-cloudfront.yml
    with:
      client_name: "seduc"
      environment: "production"
      s3_bucket: "portal-seduc-prod-385697366782"
      cloudfront_distribution_id: "E2QIFHYCIWSYVF"
      aws_region: "sa-east-1"
      react_app_api_url: "https://api.go.inttegrasocial.com.br/api"
      react_app_front_app: "seduc"
      react_app_title: "Seduc"
      react_app_description: "Dashboard da Secretaria de Estado da Educação - SEDUC"
      react_app_sga_api_base_url: "https://sandbox.sga.integrapay.com.br/api"
    secrets: inherit